services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: stock-api

    ports:
      - '3333:3333'

    volumes:
      - ./apps/api:/app
      - /app/node_modules

    environment:
      NODE_ENV: development
      PORT: 3333

    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: stock-web

    ports:
      - '5173:5173'

    volumes:
      - ./apps/web:/app
      - /app/node_modules

    environment:
      VITE_API_URL: http://localhost:3333

    depends_on:
      - api

  postgres:
    image: postgres:17-alpine

    container_name: stock-postgres

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
